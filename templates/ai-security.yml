spec:
  component: [version]
  inputs:
    repository-url:
      description: "Optional HTTPS Git repository URL to scan instead of the current checkout. Public hosts are allowlisted by default; never embed credentials."
      default: ""
    branch:
      description: "Optional branch to scan on the target public repository. If blank, Git uses its default branch."
      default: ""
    engine-image:
      description: "Base image path published by the AIShield Scanner project (the component version is appended)."
      default: "registry.gitlab.com/trisai-secure/eagleshield/engine"
    stage:
      description: "Existing GitLab pipeline stage in which AIShield runs."
      default: test
---
ai-security:scan:
  stage: $[[ inputs.stage ]]
  image:
    name: "$[[ inputs.engine-image ]]:$[[ component.version ]]"
    entrypoint: [""]
  # If DAST is enabled, wait for its job and merge its normalized/raw reports into
  # the final report bundle. The dependency is optional when DAST is disabled.
  needs:
    - job: ai-security:dast
      artifacts: true
      optional: true
  variables:
    AISECURITY_REPOSITORY_URL: "$[[ inputs.repository-url ]]"
    AISECURITY_BRANCH: "$[[ inputs.branch ]]"
    AISECURITY_REPORT_DIR: "aishield-reports"
    AISECURITY_UPLOAD_REQUIRED: "true"
  script:
    - |
      AISECURITY_REPO_PATH="$(python -m aishield.intake)" || exit $?
      cleanup_target() {
        case "${AISECURITY_REPO_PATH:-}" in
          /tmp/aishield-target-*) rm -rf -- "$AISECURITY_REPO_PATH" ;;
        esac
      }
      trap cleanup_target EXIT HUP INT TERM
      export AISECURITY_REPO="$AISECURITY_REPO_PATH"

      # Always attempt report upload after scanning, including scans that fail a severity/coverage gate.
      set +e
      python -m aishield.pipeline
      scan_rc=$?
      python -m aishield.uploader --required
      upload_rc=$?
      set -e

      echo ""
      echo "=================================================="
      echo "AIShield Dashboard"
      echo "=================================================="
      echo "The dashboard URL is printed by the report upload step."
      echo "Local artifacts: ${CI_JOB_URL}/artifacts/browse/aishield-reports/"
      echo "=================================================="

      if [ "$upload_rc" -ne 0 ] && [ "$scan_rc" -eq 0 ]; then
        scan_rc=3
      fi
      exit "$scan_rc"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - aishield-reports/
  interruptible: true
  timeout: 45m
  allow_failure: false

# Separate image/job because ZAP is a Java-based scanner; the engine image is kept lean.
ai-security:dast:
  stage: $[[ inputs.stage ]]
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  rules:
    - if: '$AISECURITY_ENABLE_DAST == "true"'
    - when: never

  script:
    - |
      mkdir -p aishield-reports
      # Fail closed before starting ZAP if the URL/host allowlist is missing or unsafe.
      if ! python3 - <<'PY'
      import ipaddress, os, socket, sys
      from urllib.parse import urlparse
      url = os.getenv("AISECURITY_DAST_TARGET_URL", "").strip()
      allowed = {x.strip().lower().rstrip(".") for x in os.getenv("AISECURITY_DAST_ALLOWED_HOSTS", "").split(",") if x.strip()}
      allow_private = os.getenv("AISECURITY_DAST_ALLOW_PRIVATE_TARGET", "false").lower() == "true"
      try:
          p = urlparse(url)
          if p.scheme != "https" or not p.hostname or p.username or p.password or p.query or p.fragment:
              raise ValueError("Target must be an HTTPS URL without credentials, query parameters or fragment")
          host = p.hostname.lower().rstrip(".")
          if host not in allowed:
              raise ValueError("Target hostname is not in the exact AISECURITY_DAST_ALLOWED_HOSTS allowlist")
          port = p.port or 443
          ips = sorted({item[4][0] for item in socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)})
          if not ips:
              raise ValueError("Target hostname resolved to no addresses")
          for raw in ips:
              ip = ipaddress.ip_address(raw)
              if ip.is_link_local or ip.is_multicast or ip.is_unspecified or (not ip.is_global and not allow_private):
                  raise ValueError("Target resolves to a non-public or otherwise blocked IP; private targets require explicit opt-in")
      except Exception as exc:
          print(f"DAST target rejected: {type(exc).__name__}: {exc}", file=sys.stderr)
          sys.exit(1)
      print(f"DAST target validated: host={host}; resolved_addresses={ips}")
      PY
      then
        python3 - <<'PY'
      import json
      from pathlib import Path
      status={"status":"target_rejected","exit_code":98,"reason":"URL validation or exact-host allowlist failed"}
      finding={"id":"zap-target-rejected","scanner":"owasp-zap-baseline","category":"coverage","rule_id":"zap-target-rejected","title":"DAST target rejected","description":"The target did not pass URL and exact-host allowlist checks; no DAST request was sent.","severity":"low","confidence":"high","path":"","line":None,"evidence":"target validation failed; see job log","recommendation":"Use an explicitly authorized HTTPS test endpoint and add its exact hostname to the allowlist.","references":["https://www.zaproxy.org/docs/docker/baseline-scan/"],"verified":False}
      Path("aishield-reports/zap-status.json").write_text(json.dumps(status,indent=2)+"\n")
      Path("aishield-reports/dast-security.json").write_text(json.dumps({"schema_version":"1.1","stage":"dast-security","metadata":status,"findings":[finding]},indent=2)+"\n")
      PY
        echo "DAST target rejected; report artifacts will be retained."
        exit 1
      fi
      set +e
      /zap/zap-baseline.py -t "$AISECURITY_DAST_TARGET_URL" -J aishield-reports/zap-baseline.json
      zap_rc=$?
      set -e
      python3 - "$zap_rc" <<'PY'
      import json, sys
      from pathlib import Path
      rc = int(sys.argv[1])
      status = "completed" if rc == 0 else "error"
      Path("aishield-reports/zap-status.json").write_text(json.dumps({"status":status,"exit_code":rc,"mode":"baseline-passive"}, indent=2)+"\n")
      # Normalize ZAP alerts into a small AIShield-compatible report. Raw response bodies are never copied.
      findings=[]
      try:
          payload=json.loads(Path("aishield-reports/zap-baseline.json").read_text(encoding="utf-8"))
          sites=payload.get("site", []) if isinstance(payload, dict) else []
          sevmap={"informational":"info","info":"info","low":"low","medium":"medium","high":"high"}
          import hashlib
          for site in sites if isinstance(sites,list) else []:
              for alert in site.get("alerts",[]) if isinstance(site,dict) and isinstance(site.get("alerts",[]),list) else []:
                  if not isinstance(alert,dict): continue
                  risk=str(alert.get("riskdesc", "Informational")).split()[0].lower()
                  title=str(alert.get("alert", "ZAP alert"))[:240]
                  instances=alert.get("instances",[])
                  urls=[]
                  from urllib.parse import urlsplit, urlunsplit
                  for inst in instances[:5] if isinstance(instances,list) else []:
                      uri=inst.get("uri") if isinstance(inst,dict) else None
                      if isinstance(uri,str):
                          p=urlsplit(uri); urls.append(urlunsplit((p.scheme,p.netloc,p.path,"",""))[:500])
                  evidence="; ".join(urls)[:1000] if urls else f"risk={risk}; instances={len(instances) if isinstance(instances,list) else 0}"
                  findings.append({"id":hashlib.sha256(("owasp-zap|"+title+"|"+evidence).encode()).hexdigest()[:20],"scanner":"owasp-zap-baseline","category":"api-web-dast","rule_id":str(alert.get("pluginid","zap-alert")),"title":title,"description":str(alert.get("desc", ""))[:1500],"severity":sevmap.get(risk,"info"),"confidence":"medium","path":"","line":None,"evidence":evidence,"recommendation":str(alert.get("solution", "Review the alert and apply the documented guidance."))[:1200],"references":["https://www.zaproxy.org/docs/alerts/"],"verified":False})
      except Exception as exc:
          findings.append({"id":"zap-report-error","scanner":"owasp-zap-baseline","category":"coverage","rule_id":"zap-report-invalid","title":"ZAP report missing or invalid","description":"ZAP did not produce a readable JSON report; this is not a clean scan.","severity":"low","confidence":"high","path":"","line":None,"evidence":type(exc).__name__,"recommendation":"Review ZAP execution and artifact paths, then rerun DAST.","references":["https://www.zaproxy.org/docs/docker/baseline-scan/"],"verified":False})
      if rc != 0:
          findings.append({"id":"zap-incomplete","scanner":"owasp-zap-baseline","category":"coverage","rule_id":"zap-scan-incomplete","title":"ZAP scan did not complete cleanly","description":"The ZAP process exited non-zero; findings collected are retained but coverage is incomplete.","severity":"low","confidence":"high","path":"","line":None,"evidence":f"exit_code={rc}","recommendation":"Resolve the ZAP execution error and rerun.","references":["https://www.zaproxy.org/docs/docker/baseline-scan/"],"verified":False})
      report={"schema_version":"1.1","stage":"dast-security","metadata":{"status":"completed" if rc == 0 else "incomplete","engine":"OWASP ZAP Baseline","mode":"passive","target_host":__import__("urllib.parse",fromlist=["urlparse"]).urlparse(__import__("os").getenv("AISECURITY_DAST_TARGET_URL","")).hostname,"alert_count":len(findings),"zap_exit_code":rc},"findings":findings}
      Path("aishield-reports/dast-security.json").write_text(json.dumps(report,indent=2)+"\n",encoding="utf-8")
      threshold=__import__("os").getenv("AISECURITY_FAIL_ON","high").lower()
      order={"critical":5,"high":4,"medium":3,"low":2,"info":1}
      gate=0 if threshold=="none" else order.get(threshold,4)
      violations=[f for f in findings if f.get("category")!="coverage" and gate and order.get(f.get("severity","medium"),3)>=gate]
      print(f"AIShield DAST report: {len(findings)} finding(s), ZAP exit={rc}, threshold={threshold}")
      sys.exit(1 if rc != 0 or any(f.get("category")=="coverage" for f in findings) or violations else 0)
      PY
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - aishield-reports/dast-security.json
      - aishield-reports/zap-status.json
  interruptible: true
  timeout: 15m
  # The main scan job consumes these artifacts and records DAST failures as coverage gaps.
  allow_failure: true
